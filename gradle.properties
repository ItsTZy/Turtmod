# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Shared, version-independent properties.
# Per-Minecraft-version dependency coordinates live in build.gradle.kts (the `deps` when-block);
# the Stonecutter version list lives in settings.gradle.kts. See PORTING_HANDOFF.md.
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.tzy.turtmod
